name: Build and Deploy - BP Calculator
# commit SHA in the run list, so each run shows which change it deploys
run-name: Deploy ${{ github.sha }}

on:
  push:
    branches: [master]
  workflow_dispatch:

# one production deploy or rollback at a time (shared with rollback.yml)
concurrency:
  group: production
  cancel-in-progress: false

# each GitHub environment (test, stage, production) has its own
#   variable AZURE_WEBAPP_NAME and secret AZURE_WEBAPP_PUBLISH_PROFILE
env:
  IMAGE_NAME: praveenps025/bpcalc
  APP_DIR: BPCalculator_Python

jobs:
  # all CI checks (tests, coverage, code analysis, security, Docker) - see ci.yml
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64
          push: true
          # plain single-platform manifest; avoids attestation entries App Service can't pull
          provenance: false
          sbom: false
          # served as the X-App-Version header, so the health check knows which version is live
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # the same image goes test -> stage -> production; a failed health check stops the promotion
  deploy-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: index.docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health check
        run: bash .github/scripts/health-check.sh "${{ steps.deploy.outputs.webapp-url }}" "${{ github.sha }}"

      - name: Show deployed version
        run: |
          {
            echo "## Deployed to test"
            echo "Version: \`${GITHUB_SHA::7}\` (full SHA: \`$GITHUB_SHA\`)"
            echo "Site: ${{ steps.deploy.outputs.webapp-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-stage:
    needs: deploy-test
    runs-on: ubuntu-latest
    # write access only to publish the k6 report to the gh-pages branch
    permissions:
      contents: write
    environment:
      name: stage
      url: ${{ steps.deploy.outputs.webapp-url }}
    # k6 results and report link for the Slack messages
    outputs:
      k6-result: ${{ steps.k6.outcome }}
      k6-p95: ${{ steps.k6-results.outputs.p95 }}
      k6-failed: ${{ steps.k6-results.outputs.failed }}
      k6-report: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: index.docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Health check
        run: bash .github/scripts/health-check.sh "${{ steps.deploy.outputs.webapp-url }}" "${{ github.sha }}"

      - name: Show deployed version
        run: |
          {
            echo "## Deployed to stage"
            echo "Version: \`${GITHUB_SHA::7}\` (full SHA: \`$GITHUB_SHA\`)"
            echo "Site: ${{ steps.deploy.outputs.webapp-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # performance test; a missed threshold fails this job, so production is not deployed
      - uses: grafana/setup-k6-action@v1

      - name: k6 load test
        id: k6
        env:
          BASE_URL: ${{ steps.deploy.outputs.webapp-url }}
          # Grafana's HTML report of the run, uploaded below
          K6_WEB_DASHBOARD: "true"
          K6_WEB_DASHBOARD_EXPORT: k6-report.html
        run: k6 run --summary-export=k6-summary.json ${{ env.APP_DIR }}/tests/performance/load-test.js

      - name: Add k6 results to run summary
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        run: |
          jq -r '
            "## k6 load test (stage): \(if "${{ steps.k6.outcome }}" == "success" then "passed" else "FAILED" end)",
            "| Measure | Result | Limit |",
            "|---|---|---|",
            "| Requests | \(.metrics.http_reqs.count) | |",
            "| p95 response time | \(.metrics.http_req_duration["p(95)"] | floor) ms | < 1000 ms |",
            "| Failed requests | \(.metrics.http_req_failed.value * 100 | . * 100 | floor / 100)% | < 1% |",
            "| Checks passed | \(.metrics.checks.value * 100 | . * 100 | floor / 100)% | > 99% |"
          ' k6-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Keep k6 results for Slack
        id: k6-results
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        run: |
          jq -r '
            "p95=\(.metrics.http_req_duration["p(95)"] | floor)",
            "failed=\(.metrics.http_req_failed.value * 100 | . * 100 | floor / 100)"
          ' k6-summary.json >> "$GITHUB_OUTPUT"

      - name: Upload k6 results
        if: always() && (steps.k6.outcome == 'success' || steps.k6.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: |
            k6-summary.json
            k6-report.html

      # GitHub Pages: k6/latest/ is the newest report, k6/<commit>/ keeps each run's report
      - name: Prepare k6 report for GitHub Pages
        id: pages
        if: always() && hashFiles('k6-report.html') != ''
        run: |
          mkdir -p "pages/k6/$GITHUB_SHA" pages/k6/latest
          cp k6-report.html "pages/k6/$GITHUB_SHA/index.html"
          cp k6-report.html pages/k6/latest/index.html
          echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/k6" >> "$GITHUB_OUTPUT"

      - name: Publish k6 report to GitHub Pages
        if: always() && steps.pages.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages
          keep_files: true
          commit_message: "k6 report for ${{ github.sha }}"

      - name: Link k6 report in run summary
        if: always() && steps.pages.outcome == 'success'
        run: |
          {
            echo "k6 report: ${{ steps.pages.outputs.url }}/$GITHUB_SHA/ (latest run: ${{ steps.pages.outputs.url }}/latest/)"
          } >> "$GITHUB_STEP_SUMMARY"

  # tells Slack that stage passed and production is waiting for approval
  notify-approval:
    needs: deploy-stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Slack - waiting for approval
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          K6_P95: ${{ needs.deploy-stage.outputs.k6-p95 }}
          K6_FAILED: ${{ needs.deploy-stage.outputs.k6-failed }}
          K6_REPORT: ${{ needs.deploy-stage.outputs.k6-report }}
        run: |
          subject=$(git log -1 --format=%s | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          bash .github/scripts/slack-notify.sh \
            "⏳ BP Calculator ${GITHUB_SHA::7} is waiting for approval to go to production" \
            "*Version:* \`${GITHUB_SHA::7}\` - $subject
          *Pushed by:* $GITHUB_ACTOR

          ✅ Build and push
          ✅ Test - health check passed
          ✅ Stage - health check passed
          ✅ k6 - p95 ${K6_P95} ms (limit 1000 ms), failed requests ${K6_FAILED}% (limit 1%)
          ⏳ Production - waiting for approval" \
            "Review and approve=$run_url" \
            "k6 report=${K6_REPORT:+$K6_REPORT/$GITHUB_SHA/}"

  # a required reviewer on the production environment makes this job wait for approval
  deploy-prod:
    needs: deploy-stage
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    # site and automatic rollback result for the Slack message
    outputs:
      url: ${{ steps.deploy.outputs.webapp-url }}
      rollback-result: ${{ steps.rollback.outcome }}
      rollback-version: ${{ steps.stable.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # the commit-SHA tag makes App Service pull exactly the image just built
          images: index.docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # waits for the new version to be live, then checks the pages
      - name: Health check
        id: health
        run: bash .github/scripts/health-check.sh "${{ steps.deploy.outputs.webapp-url }}" "${{ github.sha }}"

      # keep the version this deploy replaces as "previous", so a manual rollback can go back to it
      # (skipped when re-deploying the version that is already stable)
      - name: Keep current stable version as previous
        run: |
          if ! docker pull -q ${{ env.IMAGE_NAME }}:stable; then
            echo "No stable image yet, nothing to keep"
            exit 0
          fi
          current=$(docker image inspect ${{ env.IMAGE_NAME }}:stable \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_VERSION=//p')
          if [ -n "$current" ] && [ "$current" != "${{ github.sha }}" ]; then
            docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:previous ${{ env.IMAGE_NAME }}:$current
            echo "Previous version is now $current"
          fi

      # the "stable" tag always points at the last version that passed the live health check
      - name: Mark this version as stable
        run: docker buildx imagetools create -t ${{ env.IMAGE_NAME }}:stable ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # same short SHA as the "Version" label in the corner of the calculator page
      - name: Show deployed version
        run: |
          {
            echo "## Deployed to production"
            echo "Version: \`${GITHUB_SHA::7}\` (full SHA: \`$GITHUB_SHA\`)"
            echo "Site: ${{ steps.deploy.outputs.webapp-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---- automatic rollback: only if the deploy or the health check failed ----

      - name: Find last stable version
        id: stable
        if: failure() && (steps.deploy.outcome == 'failure' || steps.health.outcome == 'failure')
        run: |
          if ! docker pull -q ${{ env.IMAGE_NAME }}:stable; then
            echo "::error::No stable image yet, nothing to roll back to"
            exit 1
          fi
          version=$(docker image inspect ${{ env.IMAGE_NAME }}:stable \
            --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_VERSION=//p')
          echo "Rolling back to $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Roll back to stable version
        id: rollback
        if: failure() && steps.stable.outcome == 'success'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: index.docker.io/${{ env.IMAGE_NAME }}:${{ steps.stable.outputs.version }}

      - name: Health check after rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          bash .github/scripts/health-check.sh "${{ steps.rollback.outputs.webapp-url }}" "${{ steps.stable.outputs.version }}"
          {
            echo "## Deployment rolled back"
            echo "Version \`${{ github.sha }}\` failed, so production was rolled back to the last stable version \`${{ steps.stable.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # final Slack message: live, rolled back, or the stage where the deploy stopped
  notify-result:
    needs: [ci, build-and-push, deploy-test, deploy-stage, deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Slack - deploy result
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CI_RESULT: ${{ needs.ci.result }}
          BUILD_RESULT: ${{ needs.build-and-push.result }}
          TEST_RESULT: ${{ needs.deploy-test.result }}
          STAGE_RESULT: ${{ needs.deploy-stage.result }}
          PROD_RESULT: ${{ needs.deploy-prod.result }}
          K6_RESULT: ${{ needs.deploy-stage.outputs.k6-result }}
          K6_P95: ${{ needs.deploy-stage.outputs.k6-p95 }}
          K6_FAILED: ${{ needs.deploy-stage.outputs.k6-failed }}
          K6_REPORT: ${{ needs.deploy-stage.outputs.k6-report }}
          PROD_URL: ${{ needs.deploy-prod.outputs.url }}
          ROLLBACK_RESULT: ${{ needs.deploy-prod.outputs.rollback-result }}
          ROLLBACK_VERSION: ${{ needs.deploy-prod.outputs.rollback-version }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              cancelled) echo "⛔" ;;
              *) echo "⏭️" ;;
            esac
          }
          version="${GITHUB_SHA::7}"
          subject=$(git log -1 --format=%s | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          stages="$(icon "$CI_RESULT") CI checks
          $(icon "$BUILD_RESULT") Build and push
          $(icon "$TEST_RESULT") Test
          $(icon "$STAGE_RESULT") Stage"
          if [ -n "$K6_RESULT" ]; then
            stages+="
          $(icon "$K6_RESULT") k6 - p95 ${K6_P95:-?} ms (limit 1000 ms), failed requests ${K6_FAILED:-?}% (limit 1%)"
          fi
          stages+="
          $(icon "$PROD_RESULT") Production"

          # first stage that did not succeed
          stopped=""
          for stage in "CI checks:$CI_RESULT" "Build and push:$BUILD_RESULT" "Test:$TEST_RESULT" \
                       "Stage:$STAGE_RESULT" "Production:$PROD_RESULT"; do
            if [ "${stage#*:}" != "success" ]; then
              stopped="${stage%:*}"
              break
            fi
          done
          if [ "$stopped" = "Stage" ] && [ "$K6_RESULT" = "failure" ]; then
            stopped="Stage (k6 load test)"
          fi

          if [ -z "$stopped" ]; then
            title="✅ BP Calculator $version is live in production"
          elif [ "$ROLLBACK_RESULT" = "success" ]; then
            title="⚠️ BP Calculator $version failed in production, rolled back to ${ROLLBACK_VERSION::7}"
          else
            title="❌ BP Calculator $version deploy stopped at: $stopped"
            stages+="

          Production was not changed."
          fi

          app_url=""
          if [ "$PROD_RESULT" = "success" ] || [ "$ROLLBACK_RESULT" = "success" ]; then
            app_url="$PROD_URL"
          fi

          bash .github/scripts/slack-notify.sh "$title" \
            "*Version:* \`$version\` - $subject
          *Pushed by:* $GITHUB_ACTOR

          $stages" \
            "Open app=$app_url" \
            "k6 report=${K6_REPORT:+$K6_REPORT/$GITHUB_SHA/}" \
            "Pipeline run=$run_url"
