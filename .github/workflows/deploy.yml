name: Build and Deploy - BP Calculator

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE_NAME: praveenps025/bpcalc
  AZURE_WEBAPP_NAME: ca1
  APP_DIR: BPCalculator_Python

jobs:
  # all CI checks (tests, coverage, code analysis, security, Docker) - see ci.yml
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          platforms: linux/amd64
          push: true
          # plain single-platform manifest; avoids attestation entries App Service can't pull
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          # the commit-SHA tag makes App Service pull exactly the image just built
          images: index.docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
