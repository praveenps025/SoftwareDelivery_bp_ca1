name: Rollback - BP Calculator

# manual rollback: Actions tab -> "Rollback - BP Calculator" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Full commit SHA to deploy (leave empty for the version before the current one)"
        required: false
        default: ""

permissions:
  contents: read

# never runs at the same time as a deploy (shared with deploy.yml)
concurrency:
  group: production
  cancel-in-progress: false

# AZURE_WEBAPP_NAME (variable) and AZURE_WEBAPP_PUBLISH_PROFILE (secret) come from the production environment
env:
  IMAGE_NAME: praveenps025/bpcalc

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # input is passed through env, never pasted into the script, to avoid injection
      - name: Choose version
        id: target
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          if [ -z "$REQUESTED" ]; then
            if ! docker pull -q "$IMAGE_NAME:previous"; then
              echo "::error::No previous version yet, enter a commit SHA instead"
              exit 1
            fi
            version=$(docker image inspect "$IMAGE_NAME:previous" \
              --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^APP_VERSION=//p')
          elif [[ "$REQUESTED" =~ ^[0-9a-f]{40}$ ]]; then
            docker buildx imagetools inspect "$IMAGE_NAME:$REQUESTED" > /dev/null
            version="$REQUESTED"
          else
            echo "::error::Version must be a full 40-character commit SHA"
            exit 1
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not find a version to roll back to"
            exit 1
          fi
          echo "Rolling back to $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy chosen version
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: index.docker.io/${{ env.IMAGE_NAME }}:${{ steps.target.outputs.version }}

      - name: Health check
        run: |
          bash .github/scripts/health-check.sh "${{ steps.deploy.outputs.webapp-url }}" "${{ steps.target.outputs.version }}"
          {
            echo "## Manual rollback"
            echo "Production is now running \`${{ steps.target.outputs.version }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # the rolled-back version is live and healthy, so it becomes the stable one;
      # otherwise the next deploy would keep the bad version as "previous"
      - name: Mark this version as stable
        run: docker buildx imagetools create -t "$IMAGE_NAME:stable" "$IMAGE_NAME:${{ steps.target.outputs.version }}"

      - name: Slack - rollback result
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.target.outputs.version }}
          APP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$JOB_STATUS" = "success" ]; then
            title="⚠️ Production rolled back to ${VERSION::7}"
            message="Manual rollback by *$GITHUB_ACTOR*: production is running \`${VERSION::7}\` and passed the health check."
          else
            title="❌ Rollback failed"
            message="Manual rollback by *$GITHUB_ACTOR* to \`${VERSION:-unknown}\` did not finish. Check the run."
          fi
          bash .github/scripts/slack-notify.sh "$title" "$message" \
            "Open app=$APP_URL" \
            "Rollback run=$run_url"
